name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full regression
        run: npm run test:regression

  e2e:
    name: Real Herdr e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Herdr 0.7.5
        run: |
          curl -sSfL https://github.com/herdrdev/herdr/releases/download/v0.7.5/herdr-linux-x86_64 -o /tmp/herdr
          install -m 755 /tmp/herdr "$HOME/.local/bin/herdr"
          herdr --version

      - name: Install dependencies
        run: npm ci

      - name: Real Herdr e2e
        run: npm run test:e2e
